name: Pytest

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  pytest:
    runs-on: macos-latest # on ubunut the Qt libs are missing: ImportError: libEGL.so.1: cannot open shared object file: No such file or directory
    timeout-minutes: 10
    name: runner / pytest / ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: roastserver-cache
            pytest-path: test/unitary/artisanlib/roastserver/test_cache.py
          - label: roastserver-coexistence
            pytest-path: test/unitary/artisanlib/roastserver/test_coexistence.py
          - label: inventory
            pytest-path: test/unitary/artisanlib/roastserver/test_inventory.py
          - label: inventory-api
            pytest-path: test/unitary/artisanlib/roastserver/test_inventory_api.py
          - label: inventory-contract
            pytest-path: test/unitary/artisanlib/roastserver/test_inventory_contract.py
          - label: inventory-controller
            pytest-path: test/unitary/artisanlib/roastserver/test_inventory_controller.py
          - label: inventory-dialogs
            pytest-path: test/unitary/artisanlib/roastserver/test_inventory_dialogs.py
          - label: inventory-store
            pytest-path: test/unitary/artisanlib/roastserver/test_inventory_store.py
          - label: inventory-worker
            pytest-path: test/unitary/artisanlib/roastserver/test_inventory_worker.py
          - label: roastserver-controller
            pytest-path: test/unitary/artisanlib/roastserver/test_roastserver_controller.py
          - label: roastserver-dialogs
            pytest-path: test/unitary/artisanlib/roastserver/test_roastserver_dialogs.py
          - label: roastserver-worker
            pytest-path: test/unitary/artisanlib/roastserver/test_worker.py
          - label: canvas
            pytest-path: test/unitary/artisanlib/test_canvas.py
          - label: main
            pytest-path: test/unitary/artisanlib/test_main.py
          - label: santoker-warmup
            pytest-path: test/unitary/artisanlib/test_santoker_warmup.py
          - label: util
            pytest-path: test/unitary/artisanlib/test_util.py
          - label: ci-workflows
            pytest-path: test/unitary/test_ci_workflows.py
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python 3.14
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: 'pip' # caching pip dependencies

#      - name: Install Linux Qt system dependencies
#        if: runner.os == 'Linux'
#        run: |
#          # APT update
#          sudo apt update
#
#          # Install Pyside6 system dependencies
#          # https://doc.qt.io/qt-6/linux-requirements.html
#          sudo apt install -y \
#            libfontconfig1-dev \
#            libfreetype6-dev \
#            libx11-dev \
#            libx11-xcb-dev \
#            libxext-dev \
#            libxfixes-dev \
#            libxi-dev \
#            libxrender-dev \
#            libxkbcommon-dev \
#            libxkbcommon-x11-dev \
#            libatspi2.0-dev \
#            '^libxcb.*-dev'

# actions/setup-python@v4 commes with an automatic pip cache
#      - name: Get pip cache dir
#        id: pip-cache
#        run: |
#          echo "::set-output name=dir::$(pip cache dir)"
#      - uses: actions/cache@v3
#        id: cache
#        with:
##          path: ~/.cache/pip # ubuntu
##          path: ~/Library/Caches/pip # macos
#          path: ${{ steps.pip-cache.outputs.dir }} # generic
#          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.*') }}
#          restore-keys: |
#            ${{ runner.os }}-pip-
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade -r src/requirements-dev.txt
          pip install -r src/requirements.txt
      - name: Collect test module
        working-directory: src
        run: |
          pytest --collect-only -q ${{ matrix.pytest-path }}
