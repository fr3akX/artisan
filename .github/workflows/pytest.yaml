name: Pytest

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  pytest:
    runs-on: macos-latest # on ubunut the Qt libs are missing: ImportError: libEGL.so.1: cannot open shared object file: No such file or directory
    timeout-minutes: 5
    name: runner / pytest / ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: pytest-outbox
            probe: pytest
          - label: runpy-normal
            probe: runpy-normal
          - label: runpy-forced-exit
            probe: runpy-forced-exit
          - label: production-normal
            probe: production-normal
          - label: production-forced-exit
            probe: production-forced-exit
          - label: stdlib-normal
            probe: stdlib-normal
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python 3.14
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: 'pip' # caching pip dependencies

#      - name: Install Linux Qt system dependencies
#        if: runner.os == 'Linux'
#        run: |
#          # APT update
#          sudo apt update
#
#          # Install Pyside6 system dependencies
#          # https://doc.qt.io/qt-6/linux-requirements.html
#          sudo apt install -y \
#            libfontconfig1-dev \
#            libfreetype6-dev \
#            libx11-dev \
#            libx11-xcb-dev \
#            libxext-dev \
#            libxfixes-dev \
#            libxi-dev \
#            libxrender-dev \
#            libxkbcommon-dev \
#            libxkbcommon-x11-dev \
#            libatspi2.0-dev \
#            '^libxcb.*-dev'

# actions/setup-python@v4 commes with an automatic pip cache
#      - name: Get pip cache dir
#        id: pip-cache
#        run: |
#          echo "::set-output name=dir::$(pip cache dir)"
#      - uses: actions/cache@v3
#        id: cache
#        with:
##          path: ~/.cache/pip # ubuntu
##          path: ~/Library/Caches/pip # macos
#          path: ${{ steps.pip-cache.outputs.dir }} # generic
#          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.*') }}
#          restore-keys: |
#            ${{ runner.os }}-pip-
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade -r src/requirements-dev.txt
          pip install -r src/requirements.txt
      - name: Probe outbox collection lifecycle
        working-directory: src
        run: |
          case '${{ matrix.probe }}' in
            pytest)
              pytest --collect-only -q test/unitary/artisanlib/roastserver/test_outbox.py
              ;;
            runpy-normal)
              python -c "import runpy; runpy.run_path('test/unitary/artisanlib/roastserver/test_outbox.py'); print('runpy complete', flush=True)"
              ;;
            runpy-forced-exit)
              python -c "import os, runpy; runpy.run_path('test/unitary/artisanlib/roastserver/test_outbox.py'); print('runpy complete', flush=True); os._exit(0)"
              ;;
            production-normal)
              python -c "import artisanlib.roastserver.outbox; print('production import complete', flush=True)"
              ;;
            production-forced-exit)
              python -c "import os, artisanlib.roastserver.outbox; print('production import complete', flush=True); os._exit(0)"
              ;;
            stdlib-normal)
              python -c "import concurrent.futures, ctypes, sqlite3; print('stdlib imports complete', flush=True)"
              ;;
          esac
