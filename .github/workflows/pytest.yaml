name: Pytest

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  pytest:
    runs-on: macos-latest # on ubunut the Qt libs are missing: ImportError: libEGL.so.1: cannot open shared object file: No such file or directory
    timeout-minutes: 5
    name: runner / pytest / ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: outbox-tests-01-10
            start: 0
            end: 10
          - label: outbox-tests-11-20
            start: 10
            end: 20
          - label: outbox-tests-21-30
            start: 20
            end: 30
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python 3.14
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: 'pip' # caching pip dependencies

#      - name: Install Linux Qt system dependencies
#        if: runner.os == 'Linux'
#        run: |
#          # APT update
#          sudo apt update
#
#          # Install Pyside6 system dependencies
#          # https://doc.qt.io/qt-6/linux-requirements.html
#          sudo apt install -y \
#            libfontconfig1-dev \
#            libfreetype6-dev \
#            libx11-dev \
#            libx11-xcb-dev \
#            libxext-dev \
#            libxfixes-dev \
#            libxi-dev \
#            libxrender-dev \
#            libxkbcommon-dev \
#            libxkbcommon-x11-dev \
#            libatspi2.0-dev \
#            '^libxcb.*-dev'

# actions/setup-python@v4 commes with an automatic pip cache
#      - name: Get pip cache dir
#        id: pip-cache
#        run: |
#          echo "::set-output name=dir::$(pip cache dir)"
#      - uses: actions/cache@v3
#        id: cache
#        with:
##          path: ~/.cache/pip # ubuntu
##          path: ~/Library/Caches/pip # macos
#          path: ${{ steps.pip-cache.outputs.dir }} # generic
#          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.*') }}
#          restore-keys: |
#            ${{ runner.os }}-pip-
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade -r src/requirements-dev.txt
          pip install -r src/requirements.txt
      - name: Collect outbox test subset
        working-directory: src
        run: |
          python - '${{ matrix.start }}' '${{ matrix.end }}' <<'PY'
          import ast
          from pathlib import Path
          import sys

          source = Path('test/unitary/artisanlib/roastserver/test_outbox.py')
          tree = ast.parse(source.read_text(), filename=str(source))
          tests = [
              node
              for node in tree.body
              if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef))
              and node.name.startswith('test_')
          ]
          start, end = map(int, sys.argv[1:])
          tree.body = [
              node
              for node in tree.body
              if not (
                  isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef))
                  and node.name.startswith('test_')
              )
          ] + tests[start:end]
          subset = source.with_name('test_outbox_subset.py')
          subset.write_text(ast.unparse(ast.fix_missing_locations(tree)))
          print(f'generated {len(tests[start:end])} of {len(tests)} outbox tests')
          PY
          pytest --collect-only -q test/unitary/artisanlib/roastserver/test_outbox_subset.py
