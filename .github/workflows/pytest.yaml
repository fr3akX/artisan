name: Pytest

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  pytest:
    runs-on: macos-latest # on ubunut the Qt libs are missing: ImportError: libEGL.so.1: cannot open shared object file: No such file or directory
    timeout-minutes: 5
    name: runner / pytest / ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: partner-01
            partner-index: 1
          - label: partner-02
            partner-index: 2
          - label: partner-03
            partner-index: 3
          - label: partner-04
            partner-index: 4
          - label: partner-05
            partner-index: 5
          - label: partner-06
            partner-index: 6
          - label: partner-07
            partner-index: 7
          - label: partner-08
            partner-index: 8
          - label: partner-09
            partner-index: 9
          - label: partner-10
            partner-index: 10
          - label: partner-11
            partner-index: 11
          - label: partner-12
            partner-index: 12
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python 3.14
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: 'pip' # caching pip dependencies

#      - name: Install Linux Qt system dependencies
#        if: runner.os == 'Linux'
#        run: |
#          # APT update
#          sudo apt update
#
#          # Install Pyside6 system dependencies
#          # https://doc.qt.io/qt-6/linux-requirements.html
#          sudo apt install -y \
#            libfontconfig1-dev \
#            libfreetype6-dev \
#            libx11-dev \
#            libx11-xcb-dev \
#            libxext-dev \
#            libxfixes-dev \
#            libxi-dev \
#            libxrender-dev \
#            libxkbcommon-dev \
#            libxkbcommon-x11-dev \
#            libatspi2.0-dev \
#            '^libxcb.*-dev'

# actions/setup-python@v4 commes with an automatic pip cache
#      - name: Get pip cache dir
#        id: pip-cache
#        run: |
#          echo "::set-output name=dir::$(pip cache dir)"
#      - uses: actions/cache@v3
#        id: cache
#        with:
##          path: ~/.cache/pip # ubuntu
##          path: ~/Library/Caches/pip # macos
#          path: ${{ steps.pip-cache.outputs.dir }} # generic
#          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.*') }}
#          restore-keys: |
#            ${{ runner.os }}-pip-
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade -r src/requirements-dev.txt
          pip install -r src/requirements.txt
      - name: Collect test module pair
        working-directory: src
        run: |
          partner=$(find test/unitary/artisanlib/roastserver -maxdepth 1 -name 'test_*.py' | sort | sed -n '${{ matrix.partner-index }}p')
          pytest --collect-only -q "$partner" test/unitary/artisanlib/roastserver/test_outbox.py
